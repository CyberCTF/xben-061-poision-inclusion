# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-061-24 Poision inclusion (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP personal blog that includes its post files dynamically. The flag sits in /FLAG.php.
# The benchmark folder benchmarks/XBEN-061-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-061-poision-inclusion

networks:
  lab: { cidr: 10.61.104.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the Poision inclusion page answers
    http: http://web:80/
    wait: 180
  - name: post.php includes a post file by name
    script: checks/probe.sh
    wait: 60

message: |
  Poision inclusion answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The blog includes its posts dynamically. The flag is in /FLAG.php.
